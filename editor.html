<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FM symbol editor</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #141414; font: 13px/1.4 system-ui, sans-serif; }
      canvas { display: block; }
      .ed-nav { position: fixed; left: 16px; top: 14px; display: flex; gap: 12px; z-index: 2; }
      .ed-nav a { color: #8a8a8a; text-decoration: none; }
      .is-light .ed-nav a[aria-current] { color: #111; }
      .ed-nav a[aria-current] { color: #fff; font-weight: 600; }
      .lil-gui.root { max-height: calc(100vh - 16px); }
    </style>
  </head>
  <body>
    <nav class="ed-nav"><a href="./">Compare</a> <a href="editor.html" aria-current="page">Editor</a></nav>
